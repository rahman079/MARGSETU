<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Light Theme Background Gradient -->
    <linearGradient id="bgGradLight" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>

    <!-- Arch / Setu Bridge Gradient -->
    <linearGradient id="bridgeGrad" x1="20" y1="90" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Marg / Path Gradient -->
    <linearGradient id="pathGrad" x1="60" y1="100" x2="60" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Accent Beacon Gradient -->
    <linearGradient id="beaconGrad" x1="60" y1="20" x2="60" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4338CA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="120" height="120" rx="30" fill="url(#bgGradLight)"/>
  <rect width="118" height="118" x="1" y="1" rx="29" stroke="rgba(99, 102, 241, 0.22)" stroke-width="1.5"/>

  <!-- Subtle Geographic Grid Lines -->
  <circle cx="60" cy="60" r="46" stroke="rgba(79, 70, 229, 0.08)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="60" cy="60" r="32" stroke="rgba(79, 70, 229, 0.06)" stroke-width="1"/>

  <!-- Converging Road / Marg Perspective Shape -->
  <path d="M 40 94 L 56 46 L 64 46 L 80 94 Z" fill="url(#pathGrad)"/>
  
  <!-- Dashed Center Lane Line -->
  <line x1="60" y1="88" x2="60" y2="76" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="68" x2="60" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="52" x2="60" y2="47" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Iconic Setu (Bridge Arch) Curve with M/S Harmony -->
  <path d="M 22 84 C 22 52, 42 34, 60 34 C 78 34, 98 52, 98 84" 
        stroke="url(#bridgeGrad)" 
        stroke-width="6" 
        stroke-linecap="round" 
        filter="url(#softShadow)"/>

  <!-- Inner Dynamic Bridge Ribbon -->
  <path d="M 28 84 C 28 58, 44 44, 60 44 C 76 44, 92 58, 92 84" 
        stroke="rgba(79, 70, 229, 0.25)" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-dasharray="4 3"/>

  <!-- Bridge Suspension / Anchor Cables -->
  <line x1="38" y1="84" x2="38" y2="54" stroke="rgba(2, 132, 199, 0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="82" y1="84" x2="82" y2="54" stroke="rgba(124, 58, 237, 0.35)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Apex Beacon / Location Node (Setu Apex) -->
  <circle cx="60" cy="34" r="5.5" fill="url(#beaconGrad)"/>
  <circle cx="60" cy="34" r="2.5" fill="#FFFFFF"/>
</svg>
